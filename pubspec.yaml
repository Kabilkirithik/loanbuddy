name: sitecheck
description: Tranche progress capture for construction lending.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Capture — in-app camera only. image_picker is deliberately NOT a dependency,
  # because adding it would reintroduce the gallery-upload fraud path.
  camera: ^0.11.0

  # Location + mock-location detection
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Pixel-level stamp burn-in and perceptual hashing input
  image: ^4.2.0
  crypto: ^3.0.3

  # Storage + transport
  path_provider: ^2.1.4
  http: ^1.2.2
  intl: ^0.19.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true